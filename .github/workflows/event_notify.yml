name: Anime Event Notification

on:
  workflow_dispatch:
    inputs:
      baseline_now:
        description: 'One-time migration: mark current articles as seen without posting'
        type: boolean
        default: false
      test_webhook:
        description: 'Send a Discord connection test message'
        type: boolean
        default: false
  schedule:
    - cron: '7 12,20 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write

concurrency:
  group: anime-event-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test Discord webhook (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.test_webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests
          response = requests.post(
              os.environ['DISCORD_WEBHOOK_URL'],
              json={'username': 'アニメコラボ・イベント速報',
                    'content': '✅ 【テスト通知】Webhook接続は正常です。',
                    'allowed_mentions': {'parse': []}},
              timeout=20,
          )
          response.raise_for_status()
          print('Discord webhook test succeeded')
          PY
      - name: Fetch and notify
        env:
          BASELINE_NOW: ${{ inputs.baseline_now || 'false' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python event_bot.py
      - name: Commit notification history
        if: always()
        run: |
          if [ -f sent_articles.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sent_articles.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update sent event articles'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
